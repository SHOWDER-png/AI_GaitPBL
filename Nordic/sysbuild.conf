# Thingy:53 in NCS v3.4.0 still relies on the (deprecated) Partition Manager.
# Without this line the network-core build fails with
#   "undefined node label 's0_partition'"
SB_CONFIG_PARTITION_MANAGER=y

# Network core image: BLE radio firmware (ipc_radio) instead of the empty placeholder
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y

# Also produce one merged hex for the app + network core images
SB_CONFIG_MERGED_HEX_FILES=y
