# Same as Nordic/sysbuild.conf. The nRF5340 has two cores: this app runs on the
# application core, the BLE radio lives on the network core and needs its own image.

# Thingy:53 still relies on the Partition Manager; without it the network-core
# build fails with "undefined node label 's0_partition'".
SB_CONFIG_PARTITION_MANAGER=y

# Network core image: BLE controller (ipc_radio, HCI over IPC) instead of an empty image
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y

# One merged hex for app + network core
SB_CONFIG_MERGED_HEX_FILES=y
