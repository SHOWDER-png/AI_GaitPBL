# Console over USB (status lines once per second)
CONFIG_STDOUT_CONSOLE=y

# BLE peripheral advertising as "GaitNode" (name comes from the protocol doc)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="GaitNode"

# Ask the central for a short connection interval: 7.5-15 ms (units of 1.25 ms).
# At 100 Hz we produce one packet every 10 ms, so the link must wake up about
# that often. The central may refuse; the firmware prints what it actually got.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
