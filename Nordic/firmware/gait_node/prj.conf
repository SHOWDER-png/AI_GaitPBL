# Console over USB (the board default USB stack provides the CDC ACM console)
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_UART_LINE_CTRL=y

# MCUboot: app-side image manager, lets the app confirm a new image after boot.
# Optional, but needed if the app calls boot_write_img_confirmed().
CONFIG_MCUBOOT_IMG_MANAGER=y

# Modules
CONFIG_GAIT_IMU=y
CONFIG_GAIT_PLANTAR=y
CONFIG_GAIT_BLE=y

# ADS7128 communicates over I2C (not the nRF5340 internal SAADC).
CONFIG_I2C=y

# Needed by the BMI270 sensor driver
CONFIG_SENSOR=y

# Needed by the BLE module. Comment out together with CONFIG_GAIT_BLE=n.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="GaitNode"
# Ask the central for a 7.5-15 ms connection interval (units of 1.25 ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# main() now runs printf with floats plus the BLE calls
CONFIG_MAIN_STACK_SIZE=4096
# More TX buffers so ~200 notifications/s (IMU + FSR at 100 Hz) are not dropped
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=7
CONFIG_BT_L2CAP_TX_BUF_COUNT=7
CONFIG_BT_BUF_EVT_RX_COUNT=10

# Test BLE without sensors (fake walking data). Set to n for real measurements.
CONFIG_GAIT_MOCK_DATA=y
