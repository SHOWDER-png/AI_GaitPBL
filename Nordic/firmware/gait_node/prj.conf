# Console over USB (same as C29)
CONFIG_STDOUT_CONSOLE=y
# printf("%f") for the console CSV output
CONFIG_CBPRINTF_FP_SUPPORT=y

# Modules: switch on as each part becomes ready
CONFIG_GAIT_IMU=y
CONFIG_GAIT_PLANTAR=n
CONFIG_GAIT_BLE=n

# Needed by the plantar module (ADS1115 over I2C). Uncomment with CONFIG_GAIT_PLANTAR=y.
# CONFIG_I2C=y
# CONFIG_ADC=y

# Needed by the BLE module. Uncomment with CONFIG_GAIT_BLE=y.
# CONFIG_BT=y
# CONFIG_BT_PERIPHERAL=y
# CONFIG_BT_DEVICE_NAME="GaitNode"
