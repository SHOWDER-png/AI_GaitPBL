# Console over USB
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Modules
CONFIG_GAIT_IMU=y
CONFIG_GAIT_PLANTAR=y
CONFIG_GAIT_BLE=y

# ADS7128 communicates over I2C (not the nRF5340 internal SAADC).
CONFIG_I2C=y

# Needed by the BMI270 sensor driver
CONFIG_SENSOR=y

# Needed by the BLE module. Comment out together with CONFIG_GAIT_BLE=n.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="GaitNode"
# Ask the central for a 7.5-15 ms connection interval (units of 1.25 ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# main() now runs printf with floats plus the BLE calls
CONFIG_MAIN_STACK_SIZE=4096
