# Console over USB
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Modules
CONFIG_GAIT_IMU=y
CONFIG_GAIT_PLANTAR=y
CONFIG_GAIT_BLE=n

# ADS7128 communicates over I2C (not the nRF5340 internal SAADC).
CONFIG_I2C=y

# Needed by the BMI270 sensor driver
CONFIG_SENSOR=y
# Needed by the BLE module. Uncomment with CONFIG_GAIT_BLE=y.
# CONFIG_BT=y
# CONFIG_BT_PERIPHERAL=y
# CONFIG_BT_DEVICE_NAME="GaitNode"
